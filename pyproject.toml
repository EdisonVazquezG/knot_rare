[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consensus-hardness"
version = "0.2.0"
description = "Reproducible consensus-hardness analyses for knot invariants"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
ae = ["tensorflow>=2.15"]
plots = ["matplotlib>=3.7", "seaborn>=0.13"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
